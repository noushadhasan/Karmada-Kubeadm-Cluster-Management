<h2 class="sr-only">Animated diagram showing internet traffic flowing through a public IP and HAProxy load balancer down to worker-1 lb and worker-2 lb</h2>
<style>
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
.flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
  .pulse { animation: none; }
}
</style>
<svg width="100%" viewBox="0 0 680 480" role="img">
<title>Traffic flow diagram</title>
<desc>Internet traffic enters on port 443, passes through a public IP with HAProxy load balancing, then splits to worker-1 lb and worker-2 lb</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Internet</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">inbound :443</text>
</g>

<line x1="340" y1="86" x2="340" y2="130" class="arr flow" stroke="#378ADD" marker-end="url(#arrow)"/>
<circle cx="340" cy="108" r="4" fill="#378ADD" class="pulse"/>

<g class="c-blue">
<rect x="190" y="130" width="300" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">Public IP — NAT / port-forward</text>
<text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">HAProxy :443</text>
<text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">load balancer, TCP/TLS passthrough</text>
</g>

<path d="M290 206 L170 260" fill="none" stroke="#378ADD" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<path d="M390 206 L510 260" fill="none" stroke="#378ADD" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<circle cx="230" cy="233" r="4" fill="#378ADD" class="pulse"/>
<circle cx="450" cy="233" r="4" fill="#378ADD" class="pulse"/>

<g class="c-teal">
<rect x="60" y="260" width="220" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="284" text-anchor="middle" dominant-baseline="central">k8s-1</text>
<text class="ts" x="170" y="306" text-anchor="middle" dominant-baseline="central">worker-1 lb</text>
</g>

<g class="c-teal">
<rect x="400" y="260" width="220" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="284" text-anchor="middle" dominant-baseline="central">k8s-2</text>
<text class="ts" x="510" y="306" text-anchor="middle" dominant-baseline="central">worker-2 lb</text>
</g>

<text class="ts" x="340" y="400" text-anchor="middle">Both worker load balancers sit behind one public IP on :443, fronted by HAProxy</text>
</svg>
